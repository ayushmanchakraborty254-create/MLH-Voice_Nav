<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxNav Popup</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" x2="12" y1="19" y2="22"></line>
          </svg>
        </div>
        <div class="logo-text">
          <h1>VoxNav</h1>
          <span class="tagline">Universal Voice Web</span>
        </div>
      </div>
      <div class="status-indicator" id="header-status">
        <span class="status-dot"></span>
        <span class="status-label" id="status-text">Ready</span>
      </div>
    </header>

    <!-- Hero Voice Button -->
    <div class="hero-action">
      <button class="voice-cta-btn" id="btn-toggle-voice">
        <span class="mic-icon">🎙️</span>
        <span id="voice-btn-label">Start Voice Navigation</span>
      </button>
      <div class="shortcut-hint">Shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>V</kbd></div>
    </div>

    <!-- Page Analysis Card -->
    <div class="card page-inspector-card">
      <div class="card-header">
        <span class="card-title">Current Webpage</span>
        <span class="domain-badge" id="page-domain">Loading...</span>
      </div>
      <div class="stats-grid">
        <div class="stat-pill">
          <span class="stat-num" id="stat-buttons">-</span>
          <span class="stat-label">Buttons</span>
        </div>
        <div class="stat-pill">
          <span class="stat-num" id="stat-links">-</span>
          <span class="stat-label">Links</span>
        </div>
        <div class="stat-pill">
          <span class="stat-num" id="stat-inputs">-</span>
          <span class="stat-label">Inputs</span>
        </div>
        <div class="stat-pill">
          <span class="stat-num" id="stat-headings">-</span>
          <span class="stat-label">Headings</span>
        </div>
      </div>
    </div>

    <!-- Recent Activity Card -->
    <div class="card activity-card">
      <div class="card-header">
        <span class="card-title">Recent Activity</span>
      </div>
      <div class="activity-body">
        <div class="activity-row">
          <span class="activity-label">Command:</span>
          <span class="activity-val" id="last-command">None yet</span>
        </div>
        <div class="activity-row">
          <span class="activity-label">Result:</span>
          <span class="activity-val result" id="last-result">Ready for input</span>
        </div>
      </div>
    </div>

    <!-- Quick Features -->
    <div class="quick-toggles">
      <button class="toggle-chip" id="chip-numbers">
        <span>🔢 Number Labels</span>
        <span class="chip-state" id="numbers-state">OFF</span>
      </button>
      <button class="toggle-chip" id="chip-feedback">
        <span>🔊 Voice Feedback</span>
        <span class="chip-state" id="feedback-state">ON</span>
      </button>
    </div>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <button class="demo-btn" id="btn-demo">
        <span>⚡ Run Interactive Demo</span>
      </button>
      <button class="settings-btn" id="btn-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
