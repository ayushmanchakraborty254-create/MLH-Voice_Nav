<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      color: #10b981;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-size: 12px;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }
    .commands {
      margin-top: 14px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .cmd-item {
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 4px;
      font-family: monospace;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🎙️</span>
    <h2>VoiceDOM Extension</h2>
  </div>
  <div class="desc">
    Autonomous voice navigation & form autopilot for any website on the internet (Amazon, Wikipedia, Government Portals).
  </div>
  <div class="toggle-box">
    <span class="toggle-label">Enable on this page</span>
    <input type="checkbox" id="vdom-toggle" checked style="cursor: pointer; width: 18px; height: 18px;">
  </div>
  <div style="margin-bottom: 12px;">
    <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px; font-weight: 500;">Groq API Key (Stored Locally)</label>
    <input type="password" id="vdom-api-key" placeholder="Enter your Groq API key" style="width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 7px 10px; color: #f8fafc; font-size: 11px;">
  </div>
  <button class="btn" id="activate-btn">⚡ Activate Voice Controller</button>
  
  <div class="commands">
    <strong>Sample Commands (Any Language):</strong>
    <div class="cmd-item">"Click sign up button"</div>
    <div class="cmd-item">"আমার নাম রমেশ, মোবাইল 9876543210"</div>
    <div class="cmd-item">"Scroll down" / "নিচে নামো"</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
